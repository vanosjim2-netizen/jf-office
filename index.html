<html lang="nl">

<meta charset="UTF-8">

<title>jf.office</title>

<script>(function(){var p=localStorage.getItem('jf-theme')||'auto';document.documentElement.dataset.theme=(p==='dark'||(p==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light';})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#eceef2;--surface:#ffffff;--ink:#15161a;--muted:#676b74;--line:#dfe2e7;--hover:#f4f5f7;--soft:rgba(21,22,26,.07);--danger:#c92a2a;--ok:#2b8a3e}
[data-theme=dark]{--bg:#0e0f11;--surface:#17181b;--ink:#eef0f3;--muted:#9a9ea7;--line:#2a2c31;--hover:#1f2024;--soft:rgba(238,240,243,.08);--danger:#ff8787;--ok:#8ce99a}
html,body{min-height:100%}
body{font-family:Onest,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
.boot{height:100vh}
.mark{display:inline-flex}.mark svg{display:block}
/* inloggen */
#auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.auth-side{background:#15161a;color:#eef0f3;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-side .mark svg{width:64px;height:64px}
.auth-side h1{font-size:46px;line-height:1.06;font-weight:600;letter-spacing:-.03em;margin-top:40px;max-width:11ch}
.auth-side p{color:#a6aab3;margin-top:16px;max-width:34ch;font-size:16px}
.auth-apps{display:grid;grid-template-columns:repeat(4,40px);gap:10px}
.auth-apps svg{width:40px;height:40px;display:block}
.auth-main{display:flex;align-items:center;justify-content:center;padding:40px 28px}
.auth-form{width:100%;max-width:360px}
.auth-form h2{font-size:26px;font-weight:600;letter-spacing:-.02em}
.auth-form .lead{color:var(--muted);margin:6px 0 26px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.inp{width:100%;height:46px;padding:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:11px;outline:none}
.inp:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--soft)}
.btn{height:46px;padding:0 18px;border-radius:11px;background:var(--ink);color:var(--bg);font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.btn:disabled{opacity:.55;cursor:default}
.full{width:100%}
.switch{margin-top:18px;font-size:14px;color:var(--muted)}
.switch button{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.msg{font-size:14px;margin-top:14px;min-height:20px;color:var(--danger)}
.msg.ok{color:var(--ok)}
/* startscherm */
#home{height:100vh;display:grid;grid-template-columns:372px minmax(0,1fr);gap:18px;padding:18px}
.side{display:flex;flex-direction:column;min-height:0;gap:12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px}
.brand .mark svg{width:32px;height:32px}
.word{font-size:18px;font-weight:600;letter-spacing:-.015em}
.apps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.app{position:relative;display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:color-mix(in srgb,var(--c) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 18%,var(--line));transition:border-color .15s,background .15s}
.app:hover{border-color:color-mix(in srgb,var(--c) 55%,var(--line));background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.app svg{width:46px;height:46px;flex:0 0 auto;display:block;border-radius:12px}
[data-theme=dark] .app svg{box-shadow:0 0 0 1px #33353b}
.app div{min-width:0}
.app b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app span{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app .plus{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.app:hover .plus,.app .plus:focus-visible{opacity:1}
.app .plus:hover{border-color:var(--ink)}
.panel{flex:1;min-height:260px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.panel .date{color:var(--muted);font-size:13px}
.panel h1{font-size:25px;line-height:1.15;font-weight:600;letter-spacing:-.025em;margin-top:1px}
.quad{display:inline-grid;grid-template-columns:1fr 1fr;gap:.06em;width:.34em;height:.34em;margin-left:.06em;vertical-align:baseline}
.quad i{border-radius:.05em}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:42px;padding:0 38px 0 38px;font-size:14px;background:var(--bg);border:1px solid transparent;border-radius:11px;outline:none}
.search input:focus{border-color:var(--ink);background:var(--surface)}
.search kbd{position:absolute;right:11px;top:50%;transform:translateY(-50%);font:inherit;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px}
.ph{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
.ph a{font-weight:500;color:var(--muted);font-size:12px}
.ph a:hover{color:var(--ink)}
.todo{display:flex;flex-direction:column;gap:1px}
.td{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 6px;border-radius:9px}
.td:hover{background:var(--hover)}
.td .tick{width:18px;height:18px;border-radius:5px;border:2px solid #9775fa;display:flex;align-items:center;justify-content:center}
.td .tick:hover{background:rgba(151,117,250,.15)}
.td.done .tick{background:#7048e8;border-color:#7048e8}
.td.done .tick::after{content:'';width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.td span{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td.done span{text-decoration:line-through;color:var(--muted)}
.td em{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap}
.td.late em{color:var(--danger);font-weight:600}
.nothing{font-size:13px;color:var(--muted);padding:4px 6px}
.favs{display:flex;flex-direction:column;gap:1px}
.fav{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:9px;font-size:14px;text-align:left;width:100%}
.fav:hover{background:var(--hover)}
.fav svg{width:22px;height:22px;flex:0 0 auto;display:block;border-radius:6px}
.fav span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.who{display:flex;align-items:center;gap:11px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
[data-theme=dark] .avatar{background:#3b6cff;color:#fff}
.who div{min-width:0}
.who b{display:block;font-weight:600;font-size:14px}
.who div span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.links{display:flex;flex-wrap:wrap;gap:4px 14px}
.links button{font-size:13px;color:var(--muted)}
.links button:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--bg);border-radius:9px;padding:3px}
.seg button{padding:5px 0;border-radius:7px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.main{min-width:0;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;overflow:hidden}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 26px 14px;flex-wrap:wrap}
.mhead h2{font-size:23px;font-weight:600;letter-spacing:-.02em}
.tabs{display:flex;gap:2px;flex-wrap:wrap;background:var(--bg);padding:3px;border-radius:10px}
.tabs button{font-size:13px;color:var(--muted);padding:6px 11px;border-radius:8px;display:flex;align-items:center;gap:6px}
.tabs button i{width:8px;height:8px;border-radius:2px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);font-weight:600;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.list{flex:1;overflow-y:auto;padding:0 14px 14px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 150px 130px;gap:16px;align-items:center;padding:10px 12px;border-radius:11px;width:100%;text-align:left}
.row.head{font-size:12px;color:var(--muted);position:sticky;top:0;background:var(--surface);border-radius:0;border-bottom:1px solid var(--line);cursor:default;z-index:1}
button.row:hover{background:var(--hover)}
.row .n{display:flex;align-items:center;gap:12px;min-width:0}
.row .n svg{width:32px;height:32px;flex:0 0 auto;display:block;border-radius:9px}
[data-theme=dark] .row .n svg,[data-theme=dark] .fav svg,[data-theme=dark] .brand svg{box-shadow:0 0 0 1px #33353b;border-radius:22%}
.row .n span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.row .a{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.row .a i{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.row .d{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.badge{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:8px;font-style:normal;flex:0 0 auto}
.empty{padding:70px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px;font-size:16px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50}
@media(max-width:900px){
#auth{grid-template-columns:1fr}
.auth-side{padding:32px 28px}
.auth-side h1{font-size:32px;margin-top:24px}
.auth-apps{margin-top:24px;grid-template-columns:repeat(8,34px)}
.auth-apps svg{width:34px;height:34px}
#home{height:auto;min-height:100vh;grid-template-columns:1fr;padding:12px}
.apps{grid-template-columns:repeat(4,minmax(0,1fr))}
.app{flex-direction:column;text-align:center;padding:12px 6px;gap:8px}
.app div{width:100%}
.panel{flex:none}
.main{min-height:70vh}
}
@media(max-width:560px){
.apps{grid-template-columns:repeat(2,minmax(0,1fr))}
.app{flex-direction:row;text-align:left;padding:10px}
.app .plus{opacity:1}
.app{padding-right:40px;gap:9px}
.app svg{width:38px;height:38px}
.row{grid-template-columns:minmax(0,1fr) 96px}
.row .a{display:none}
.mhead{padding:18px 14px 10px}
.list{padding:0 4px 8px}
}
</style>
</head>
<body>
<div class="boot" id="boot"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>

<div id="auth" class="hidden">
  <aside class="auth-side">
    <div>
      <span class="mark"><svg><use href="#i-office"/></svg></span>
      <h1>Al je werk op één plek.</h1>
      <p>Documenten, spreadsheets, presentaties, notities, planning, formulieren, tekeningen en bestanden. Met één account.</p>
    </div>
    <div class="auth-apps" id="authApps" aria-hidden="true"></div>
  </aside>
  <main class="auth-main">
    <form class="auth-form" id="authForm">
      <h2 id="authTitle">Inloggen</h2>
      <p class="lead" id="authLead">Welkom terug bij jf.office.</p>
      <label class="field"><span>E-mailadres</span><input class="inp" type="email" id="email" required autocomplete="email"></label>
      <label class="field"><span>Wachtwoord</span><input class="inp" type="password" id="password" required autocomplete="current-password"></label>
      <button class="btn full" id="authSubmit" type="submit">Inloggen</button>
      <div class="msg" id="authMsg"></div>
      <p class="switch"><span id="switchText">Nog geen account?</span> <button type="button" id="switchBtn">Account maken</button></p>
      <p class="switch"><button type="button" id="forgot">Wachtwoord vergeten</button></p>
    </form>
  </main>
</div>

<div id="home" class="hidden">
  <aside class="side">
    <a href="./" class="brand"><span class="mark"><svg><use href="#i-office"/></svg></span><span class="word">jf.office</span></a>
    <nav class="apps" id="apps" aria-label="Apps"></nav>
    <section class="panel">
      <div><p class="date" id="today"></p><h1 id="hello">Hallo<span class="quad" aria-hidden="true"><i style="background:#3b6cff"></i><i style="background:#2f9e44"></i><i style="background:#fab005"></i><i style="background:#e03131"></i></span></h1></div>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" placeholder="Zoek in al je bestanden" aria-label="Zoek in al je bestanden">
        <kbd>/</kbd>
      </div>
      <div><div class="ph">Vandaag <a href="../jf-planner/">Planner openen</a></div><div class="todo" id="todo"><div class="nothing">Laden...</div></div></div>
      <div id="favWrap" class="hidden"><div class="ph">Favorieten</div><div class="favs" id="favs"></div></div>
      <div class="acct">
        <div class="who"><span class="avatar" id="avatar">J</span><div><b id="whoName"></b><span id="whoMail"></span></div></div>
        <div class="seg" id="themeSeg" aria-label="Weergave"><button data-t="auto">Systeem</button><button data-t="light">Licht</button><button data-t="dark">Donker</button></div>
        <div class="links"><button id="nameBtn">Naam wijzigen</button><button id="pwBtn">Wachtwoord wijzigen</button><button id="logout">Uitloggen</button></div>
      </div>
    </section>
  </aside>
  <section class="main">
    <div class="mhead"><h2>Recent</h2><div class="tabs" id="tabs"></div></div>
    <div class="list" id="files"><div class="empty">Bestanden laden</div></div>
  </section>
</div>

const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

    const a = APPS.find(x => x.key === filter);
    $('files').innerHTML = '<div class="empty">' + (q ? '<b>Niets gevonden</b>Geen bestand heeft "' + esc(q) + '" in de naam.' : !files.length ? '<b>Je hebt nog geen bestanden</b>Kies links een app, of klik op de + bij een app om meteen iets nieuws te maken.' : '<b>Nog geen ' + a.many + '</b>Klik op de + bij ' + a.name + ' om er een te maken.') + '</div>';
  } else $('files').innerHTML = '<div class="row head"><span>Naam</span><span class="a">App</span><span class="d">Bewerkt</span></div>' + shown.map(f => '<button class="row" data-app="' + f.app.key + '" data-id="' + f.id + '"><span class="n">' + ico(f.app.key) + '<span>' + esc(f.title || 'Naamloos') + '</span>' + (f.is_public ? '<em class="badge">gedeeld</em>' : '') + '</span><span class="a"><i style="background:' + f.app.color + '"></i>' + f.app.name + '</span><span class="d">' + when(f.updated_at) + '</span></button>').join('');
  const favs = files.filter(f => f.pinned).slice(0, 8);
  $('favWrap').classList.toggle('hidden', !favs.length || !!q);
  $('favs').innerHTML = favs.map(f => '<button class="fav" data-app="' + f.app.key + '" data-id="' + f.id + '">' + ico(f.app.key) + '<span>' + esc(f.title || 'Naamloos') + '</span></button>').join('');
}
function openFile(key, id) { const a = APPS.find(x => x.key === key); if (!a) return; try { localStorage.setItem(a.last, id); } catch (e) {} location.href = a.url; }
document.addEventListener('click', e => { const f = e.target.closest('button[data-id][data-app]'); if (f) openFile(f.dataset.app, f.dataset.id); });
$('search').addEventListener('input', renderFiles);
$('search').addEventListener('keydown', e => { if (e.key === 'Enter') { const f = $('files').querySelector('button.row'); if (f) openFile(f.dataset.app, f.dataset.id); } if (e.key === 'Escape') { $('search').value = ''; renderFiles(); $('search').blur(); } });
document.addEventListener('keydown', e => { if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && user) { e.preventDefault(); $('search').focus(); } });
window.addEventListener('focus', () => { if (user && sb) loadAll(); });
init();
</script>
