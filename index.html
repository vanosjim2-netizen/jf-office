<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jf.office</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='116' fill='%2315161a'/%3E%3Cg fill='none' stroke='%23fff' stroke-linecap='round'%3E%3Cpath d='M161 196V318Q161 384 96 384' stroke-width='52'/%3E%3Cpath d='M271 384V200Q271 130 341 130' stroke-width='52'/%3E%3Cpath d='M224 226H330' stroke-width='44'/%3E%3C/g%3E%3Ccircle cx='161' cy='128' r='28' fill='%23fff'/%3E%3Crect x='356' y='322' width='44' height='44' rx='11' fill='%233b6cff'/%3E%3Crect x='406' y='322' width='44' height='44' rx='11' fill='%232f9e44'/%3E%3Crect x='356' y='372' width='44' height='44' rx='11' fill='%23fab005'/%3E%3Crect x='406' y='372' width='44' height='44' rx='11' fill='%23e03131'/%3E%3C/svg%3E">
<script>
(function(){var p=localStorage.getItem('jf-theme')||'auto';var d=p==='dark'||(p==='auto'&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#eef0f3;--surface:#ffffff;--ink:#15161a;--muted:#676b74;--line:#dfe2e7;--hover:#f6f7f9;--soft:rgba(21,22,26,.07);--danger:#c92a2a}
[data-theme=dark]{--bg:#101114;--surface:#18191d;--ink:#eef0f3;--muted:#9a9ea7;--line:#2a2c31;--hover:#1f2025;--soft:rgba(238,240,243,.08);--danger:#ff8787}
html,body{min-height:100%}
body{font-family:Onest,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
.boot{height:100vh}
.mark{display:inline-flex}.mark svg{display:block}
.wrap{max-width:980px;margin:0 auto;padding:0 28px}

/* inloggen */
#auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.auth-side{background:#15161a;color:#eef0f3;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.auth-side .mark svg{width:64px;height:64px}
.auth-side h1{font-size:44px;line-height:1.08;font-weight:600;letter-spacing:-.025em;margin-top:40px;max-width:12ch}
.auth-side p{color:#a6aab3;margin-top:16px;max-width:34ch;font-size:16px}
.auth-apps{display:flex;gap:10px}
.auth-apps svg{width:34px;height:34px;display:block}
.auth-main{display:flex;align-items:center;justify-content:center;padding:40px 28px}
.auth-form{width:100%;max-width:360px}
.auth-form h2{font-size:24px;font-weight:600;letter-spacing:-.015em}
.auth-form .lead{color:var(--muted);margin:6px 0 26px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.inp{width:100%;height:44px;padding:0 13px;background:var(--surface);border:1px solid var(--line);border-radius:10px;outline:none}
.inp:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--soft)}
.btn{height:44px;padding:0 18px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.btn:disabled{opacity:.55;cursor:default}
.full{width:100%}
.switch{margin-top:18px;font-size:14px;color:var(--muted)}
.switch button{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.msg{font-size:14px;margin-top:14px;min-height:20px}
.msg.err{color:var(--danger)}.msg.ok{color:#2b8a3e}
[data-theme=dark] .msg.ok{color:#8ce99a}

/* startscherm */
header{height:76px;display:flex;align-items:center;gap:12px}
header .mark svg{width:30px;height:30px}
.word{font-size:17px;font-weight:600;letter-spacing:-.01em}
.spacer{flex:1}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:600;display:flex;align-items:center;justify-content:center;font-size:15px}
.menu{position:relative}
.menu summary{list-style:none}
.menu summary::-webkit-details-marker{display:none}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:260px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 14px 36px rgba(0,0,0,.14);z-index:20}
.pop .who{padding:10px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.pop .who b{display:block;font-weight:600}
.pop .who span{font-size:13px;color:var(--muted);word-break:break-all}
.pop .item{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:8px;font-size:14px}
.pop .item:hover{background:var(--hover)}
.pop .lbl{font-size:13px;color:var(--muted);padding:10px 10px 6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--bg);border-radius:9px;padding:3px;margin:0 6px 6px}
.seg button{padding:6px 0;border-radius:7px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.hero{padding:44px 0 0}
.hero .date{color:var(--muted);font-size:15px}
.hero h1{font-size:48px;line-height:1.08;font-weight:600;letter-spacing:-.03em;margin-top:6px}
.quad{display:inline-grid;grid-template-columns:1fr 1fr;gap:.06em;width:.34em;height:.34em;margin-left:.06em;vertical-align:baseline}
.quad i{border-radius:.05em}
.search{position:relative;margin:30px 0 0}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:54px;padding:0 54px 0 46px;font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;outline:none}
.search input:focus{border-color:var(--ink);box-shadow:0 0 0 4px var(--soft)}
.search kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);font:inherit;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:22px}
.app{display:grid;grid-template-columns:46px minmax(0,1fr);gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.app:hover{border-color:var(--muted)}
.app svg{width:46px;height:46px;display:block}
.app b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.shead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:52px 0 12px;flex-wrap:wrap}
.shead h2{font-size:19px;font-weight:600;letter-spacing:-.01em}
.tabs{display:flex;gap:18px;flex-wrap:wrap}
.tabs button{font-size:14px;color:var(--muted);padding:2px 0;border-bottom:2px solid transparent}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.favs{display:flex;flex-wrap:wrap;gap:8px}
.fav{display:inline-flex;align-items:center;gap:9px;max-width:280px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px 8px 9px;font-size:14px;font-weight:500}
.fav:hover{border-color:var(--muted)}
.fav svg{width:22px;height:22px;flex:0 0 auto;display:block}
.fav span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) 170px 150px;gap:16px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-child{border-top:0}
.row.head{font-size:13px;color:var(--muted);padding-top:10px;padding-bottom:10px;cursor:default}
button.row:hover{background:var(--hover)}
.row .n{display:flex;align-items:center;gap:12px;min-width:0}
.row .n svg{width:26px;height:26px;flex:0 0 auto;display:block}
.row .n span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.row .a{font-size:14px;color:var(--muted)}
.row .d{font-size:14px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.badge{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:8px;font-weight:400}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
footer{padding:56px 0 40px;color:var(--muted);font-size:13px}
@media(max-width:860px){
#auth{grid-template-columns:1fr}
.auth-side{padding:32px 28px}
.auth-side h1{font-size:32px;margin-top:24px}
.auth-apps{margin-top:24px}
.apps{grid-template-columns:repeat(2,minmax(0,1fr))}
.hero h1{font-size:36px}
}
@media(max-width:560px){
.wrap{padding:0 18px}
.row{grid-template-columns:minmax(0,1fr) 110px}
.row .a{display:none}
.app{grid-template-columns:38px minmax(0,1fr);padding:13px;gap:10px}
.app svg{width:38px;height:38px}
.hero h1{font-size:30px}
}
</style>
</head>

<script>
const SUPABASE_URL = 'https://azzhruqhvmxqwsyatlju.supabase.co';
let SUPABASE_KEY = 'PLAK_HIER_JE_ANON_KEY';
const $ = id => document.getElementById(id);
const APPS = [
  { key: 'pages', name: 'jf.pages', table: 'documents', url: '../jf-pages/', last: 'jf-last', one: 'document', many: 'documenten', tab: 'Documenten' },
  { key: 'cells', name: 'jf.cells', table: 'workbooks', url: '../jf-cells/', last: 'jf-cells-last', one: 'spreadsheet', many: 'spreadsheets', tab: 'Spreadsheets' },
  { key: 'pres', name: 'jf.presentations', table: 'presentations', url: '../jf-presentations/', last: 'jf-pres-last', one: 'presentatie', many: 'presentaties', tab: 'Presentaties' },
  { key: 'notes', name: 'jf.notes', table: 'notebooks', url: '../jf-notes/', last: 'jf-notes-last', one: 'notitieblok', many: 'notitieblokken', tab: 'Notities' }
];
let sb = null, user = null, mode = 'login', files = [], filter = 'all', counts = {}, loaded = false;
const ico = k => '<svg><use href="#i-' + k + '"/></svg>';
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* weergave */
const mq = window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const p = localStorage.getItem('jf-theme') || 'auto';
  document.documentElement.dataset.theme = (p === 'dark' || (p === 'auto' && mq.matches)) ? 'dark' : 'light';
  [...$('themeSeg').children].forEach(b => b.classList.toggle('on', b.dataset.t === p));
}
$('themeSeg').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (!b) return; localStorage.setItem('jf-theme', b.dataset.t); applyTheme(); });
mq.addEventListener('change', applyTheme); applyTheme();
document.addEventListener('click', e => { const m = $('acct'); if (m.open && !m.contains(e.target)) m.open = false; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('acct').open = false; });

/* opstarten */
async function getKey() {
  if (SUPABASE_KEY.indexOf('PLAK_HIER') !== 0) return SUPABASE_KEY;
  try { const r = await fetch('../jf-pages/index.html', { cache: 'no-store' }); const t = await r.text(); const m = t.match(/const SUPABASE_KEY = '([^']+)'/); if (m && m[1].indexOf('PLAK_HIER') !== 0) { localStorage.setItem('jf-sb-key', m[1]); return m[1]; } } catch (e) {}
  return localStorage.getItem('jf-sb-key');
}
async function init() {
  const key = await getKey(); $('boot').remove();
  if (!key) { $('auth').classList.remove('hidden'); setMsg('De verbinding met de database is niet ingesteld.'); $('authSubmit').disabled = true; return; }
  sb = supabase.createClient(SUPABASE_URL, key);
  sb.auth.onAuthStateChange((event, session) => setTimeout(() => { if (event === 'PASSWORD_RECOVERY') changePassword(); render(session); }, 0));
}

/* inloggen */
function setMsg(t, ok) { const m = $('authMsg'); m.textContent = t; m.className = 'msg ' + (ok ? 'ok' : 'err'); }
function setMode(m) {
  mode = m; const reg = m === 'register';
  $('authTitle').textContent = reg ? 'Account maken' : 'Inloggen';
  $('authLead').textContent = reg ? 'Eén account voor alle jf.tools.' : 'Welkom terug bij jf.office.';
  $('authSubmit').textContent = reg ? 'Account maken' : 'Inloggen';
  $('switchText').textContent = reg ? 'Heb je al een account?' : 'Nog geen account?';
  $('switchBtn').textContent = reg ? 'Inloggen' : 'Account maken';
  $('password').autocomplete = reg ? 'new-password' : 'current-password';
  setMsg('');
}
$('switchBtn').onclick = () => setMode(mode === 'login' ? 'register' : 'login');
function vertaal(m) {
  if (/invalid login/i.test(m)) return 'Dit e-mailadres en wachtwoord horen niet bij elkaar.';
  if (/already registered/i.test(m)) return 'Er bestaat al een account met dit e-mailadres. Log in.';
  if (/not confirmed/i.test(m)) return 'Bevestig eerst je e-mailadres via de link in je inbox.';
  if (/rate limit/i.test(m)) return 'Te veel pogingen. Wacht even en probeer het opnieuw.';
  if (/should be different/i.test(m)) return 'Kies een ander wachtwoord dan je huidige.';
  return m;
}
$('authForm').onsubmit = async e => {
  e.preventDefault(); if (!sb) return;
  const email = $('email').value.trim(), password = $('password').value;
  if (password.length < 6) return setMsg('Gebruik een wachtwoord van minstens 6 tekens.');
  $('authSubmit').disabled = true;
  const res = mode === 'login' ? await sb.auth.signInWithPassword({ email, password }) : await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
  $('authSubmit').disabled = false;
  if (res.error) return setMsg(vertaal(res.error.message));
  if (mode === 'register' && !res.data.session) setMsg('Account gemaakt. Open de link in je e-mail om het te bevestigen.', true);
};
$('forgot').onclick = async () => { if (!sb) return; const email = $('email').value.trim(); if (!email) { $('email').focus(); return setMsg('Vul eerst je e-mailadres in.'); } const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }); if (error) setMsg(vertaal(error.message)); else setMsg('We hebben een link gestuurd om je wachtwoord opnieuw in te stellen.', true); };
async function changePassword() { const np = prompt('Nieuw wachtwoord (minstens 6 tekens):'); if (!np) return; if (np.length < 6) return alert('Gebruik een wachtwoord van minstens 6 tekens.'); const { error } = await sb.auth.updateUser({ password: np }); alert(error ? vertaal(error.message) : 'Je wachtwoord is gewijzigd.'); }
$('pwBtn').onclick = () => { $('acct').open = false; changePassword(); };
$('logout').onclick = () => { $('acct').open = false; sb.auth.signOut(); };
$('nameBtn').onclick = async () => {
  $('acct').open = false;
  const n = prompt('Hoe mogen we je noemen?', displayName()); if (n === null) return;
  const { data, error } = await sb.auth.updateUser({ data: { name: n.trim() } });
  if (error) return alert(error.message); user = data.user; greet();
};

/* startscherm */
function displayName() {
  const n = user && user.user_metadata && user.user_metadata.name; if (n) return n;
  const p = ((user && user.email) || '').split('@')[0].replace(/[._\-0-9]+/g, ' ').trim().split(' ')[0] || '';
  return p ? p[0].toUpperCase() + p.slice(1) : '';
}
function render(session) {
  const u = session && session.user ? session.user : null;
  if (window.__r && (u && u.id) === (user && user.id)) return; window.__r = true;
  user = u;
  $('auth').classList.toggle('hidden', !!u); $('home').classList.toggle('hidden', !u);
  if (!u) { $('password').value = ''; files = []; loaded = false; return; }
  greet(); renderApps(); renderTabs(); loadFiles();
}
function greet() {
  const h = new Date().getHours(), part = h < 6 ? 'Goedenacht' : h < 12 ? 'Goedemorgen' : h < 18 ? 'Goedemiddag' : 'Goedenavond', n = displayName();
  const h1 = $('hello'), quad = h1.querySelector('.quad'); h1.textContent = part + (n ? ', ' + n : ''); h1.append(quad);
  const d = new Date().toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
  $('today').textContent = d[0].toUpperCase() + d.slice(1);
  $('avatar').textContent = (n || (user.email || '?'))[0].toUpperCase();
  $('whoName').textContent = n || 'Jouw account'; $('whoMail').textContent = user.email;
}
function countText(a) { const c = counts[a.key]; if (!loaded) return '&nbsp;'; if (!c) return 'Nog leeg'; return c + ' ' + (c === 1 ? a.one : a.many); }
function renderApps() { $('apps').innerHTML = APPS.map(a => '<a class="app" href="' + a.url + '">' + ico(a.key) + '<div><b>' + a.name + '</b><span>' + countText(a) + '</span></div></a>').join(''); }
function renderTabs() { $('tabs').innerHTML = '<button data-f="all"' + (filter === 'all' ? ' class="on"' : '') + '>Alles</button>' + APPS.map(a => '<button data-f="' + a.key + '"' + (filter === a.key ? ' class="on"' : '') + '>' + a.tab + '</button>').join(''); }
$('tabs').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; filter = b.dataset.f; renderTabs(); renderFiles(); });
async function loadFiles() {
  const res = await Promise.all(APPS.map(a => sb.from(a.table).select('id,title,updated_at,pinned,is_public').is('deleted_at', null).order('updated_at', { ascending: false }).limit(200).then(r => ({ a, r }))));
  files = [];
  res.forEach(({ a, r }) => { const rows = r.error ? [] : r.data; counts[a.key] = rows.length; rows.forEach(d => files.push(Object.assign({ app: a }, d))); });
  files.sort((x, y) => y.updated_at.localeCompare(x.updated_at));
  loaded = true; renderApps(); renderFiles();
}
function when(s) {
  const d = new Date(s), now = new Date(), t = d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === now.toDateString()) return 'Vandaag ' + t;
  const y = new Date(now); y.setDate(now.getDate() - 1); if (d.toDateString() === y.toDateString()) return 'Gisteren ' + t;
  return d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
}
function renderFiles() {
  const q = $('search').value.trim().toLowerCase();
  const list = files.filter(f => (filter === 'all' || f.app.key === filter) && (!q || (f.title || '').toLowerCase().includes(q)));
  const shown = q ? list : list.slice(0, 30);
  if (!shown.length) {
    $('files').innerHTML = '<div class="empty">' + (q ? '<b>Niets gevonden</b>Geen bestand heeft "' + esc(q) + '" in de naam.' : files.length ? '<b>Hier staat nog niets</b>Je hebt nog geen bestanden van dit soort.' : '<b>Je hebt nog geen bestanden</b>Kies hierboven een app om te beginnen.') + '</div>';
  } else {
    $('files').innerHTML = '<div class="row head"><span>Naam</span><span class="a">App</span><span class="d">Bewerkt</span></div>' + shown.map(f => '<button class="row" data-app="' + f.app.key + '" data-id="' + f.id + '"><span class="n">' + ico(f.app.key) + '<span>' + esc(f.title || 'Naamloos') + '</span>' + (f.is_public ? '<em class="badge">gedeeld</em>' : '') + '</span><span class="a">' + f.app.name + '</span><span class="d">' + when(f.updated_at) + '</span></button>').join('');
  }
  const favs = files.filter(f => f.pinned).slice(0, 10);
  $('favWrap').classList.toggle('hidden', !favs.length || !!q);
  $('favs').innerHTML = favs.map(f => '<button class="fav" data-app="' + f.app.key + '" data-id="' + f.id + '">' + ico(f.app.key) + '<span>' + esc(f.title || 'Naamloos') + '</span></button>').join('');
}
function openFile(key, id) { const a = APPS.find(x => x.key === key); if (!a) return; try { localStorage.setItem(a.last, id); } catch (e) {} location.href = a.url; }
document.addEventListener('click', e => { const f = e.target.closest('[data-id][data-app]'); if (f) openFile(f.dataset.app, f.dataset.id); });
$('search').addEventListener('input', renderFiles);
$('search').addEventListener('keydown', e => { if (e.key === 'Enter') { const f = $('files').querySelector('button.row'); if (f) openFile(f.dataset.app, f.dataset.id); } if (e.key === 'Escape') { $('search').value = ''; renderFiles(); $('search').blur(); } });
document.addEventListener('keydown', e => { if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && user) { e.preventDefault(); $('search').focus(); } });
window.addEventListener('focus', () => { if (user && sb) loadFiles(); });
init();
</script>
</body>
</html>
